quarkus.application.name=restaurant-discovery
quarkus.mongodb.database=biteexpress

# Blocking JAX-RS methods run on virtual threads (easier to live-edit than Mutiny).
quarkus.virtual-threads.enabled=true

quarkus.http.port=8080
quarkus.smallrye-openapi.info-title=BiteExpress Restaurant Discovery
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=MVP restaurant discovery API (MongoDB)
quarkus.swagger-ui.always-include=true

discovery.ingest.enabled=true
discovery.ingest.resource=data/zomato.csv

%dev.quarkus.mongodb.devservices.enabled=true
%dev.quarkus.mongodb.devservices.image-name=mongo:7

%test.quarkus.mongodb.devservices.enabled=true
%test.quarkus.mongodb.devservices.image-name=mongo:7
%test.discovery.ingest.enabled=false

%prod.quarkus.mongodb.connection-string=mongodb://mongo:27017
